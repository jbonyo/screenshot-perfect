# Supabase pauses free projects after about a week with too little database activity,
# which would stop the quote form working. This calls the enquiry function once a day;
# the function runs one tiny query and returns no data.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC (08:17 in Nairobi)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the enquiry function
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            https://aakehgdlubuzjdswzuvk.supabase.co/functions/v1/submit-enquiry
